name: WIE Managed Build

on:
  push:
    branches: [main]
    paths-ignore:
      - "patches/current.py"
  workflow_dispatch:
    inputs:
      build_tag:
        description: "빌드 이름 (예: zenonia-v5)"
        required: false
        default: "zenonia-managed"
        type: string
      storage_tag:
        description: "저장공간 이름. 라이브러리를 유지하려면 managed 그대로"
        required: false
        default: "managed"
        type: string
      upstream_ref:
        description: "WIE upstream commit/ref"
        required: false
        default: "47b41b55f5fcc3def406a51abe567ce71f5025d2"
        type: string
      patch_gz_b64:
        description: "새 패치 payload. 비우면 저장된 패치 또는 내장 v4-fixed 사용"
        required: false
        type: string

permissions:
  contents: write

env:
  DEFAULT_WIE_REF: 47b41b55f5fcc3def406a51abe567ce71f5025d2
  DEFAULT_PATCH_GZ_B64: ""

jobs:
  web:
    name: Build managed WASM frontend
    runs-on: ubuntu-latest
    steps:
      - name: Resolve inputs
        id: cfg
        shell: bash
        env:
          INPUT_BUILD_TAG: ${{ inputs.build_tag }}
          INPUT_STORAGE_TAG: ${{ inputs.storage_tag }}
          INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          BUILD_TAG="${INPUT_BUILD_TAG:-zenonia-v4-fixed}"
          STORAGE_TAG="${INPUT_STORAGE_TAG:-managed}"
          UPSTREAM_REF="${INPUT_UPSTREAM_REF:-$DEFAULT_WIE_REF}"
          BUILD_TAG="$(printf '%s' "$BUILD_TAG" | tr -cd 'A-Za-z0-9._-' | cut -c1-40)"
          STORAGE_TAG="$(printf '%s' "$STORAGE_TAG" | tr -cd 'A-Za-z0-9_-' | cut -c1-32)"
          [ -n "$BUILD_TAG" ] || BUILD_TAG="managed"
          [ -n "$STORAGE_TAG" ] || STORAGE_TAG="managed"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "storage_tag=$STORAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout manager repository
        uses: actions/checkout@v7
        with:
          path: control
          persist-credentials: true

      - name: Checkout official WIE source
        uses: actions/checkout@v7
        with:
          repository: dlunch/wie
          ref: ${{ steps.cfg.outputs.upstream_ref }}
          path: src
          persist-credentials: false
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v7

      - name: Set up Rust for WebAssembly
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Prepare and persist managed patch
        shell: bash
        env:
          PATCH_GZ_B64: ${{ inputs.patch_gz_b64 }}
        run: |
          mkdir -p control/patches
          if [ -n "$PATCH_GZ_B64" ]; then
            printf '%s' "$PATCH_GZ_B64" | base64 -d | gzip -d > control/patches/current.py
            python -m py_compile control/patches/current.py
            cd control
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add patches/current.py
            if ! git diff --cached --quiet; then
              git commit -m "Update managed WIE patch [skip ci]"
              git push origin HEAD:main
            fi
            cd ..
            echo "Saved new patch as patches/current.py"
          elif [ ! -f control/patches/current.py ]; then
            printf '%s' "$DEFAULT_PATCH_GZ_B64" | base64 -d | gzip -d > control/patches/current.py
            python -m py_compile control/patches/current.py
            echo "Using built-in v4-fixed patch"
          else
            python -m py_compile control/patches/current.py
            echo "Using persisted patches/current.py"
          fi

      - name: Isolate managed storage
        shell: bash
        env:
          STORAGE_TAG: ${{ steps.cfg.outputs.storage_tag }}
        working-directory: src
        run: |
          python - <<'PY'
          from pathlib import Path
          import os
          tag = os.environ["STORAGE_TAG"]
          replacements = {
              Path("wie-web/src/ts/app_library_store.ts"): [
                  ('indexedDB.open("wie_app_library", 1)', f'indexedDB.open("wie_{tag}_app_library", 1)'),
              ],
              Path("wie-web/src/ts/library.ts"): [
                  ('const WELCOME_STORAGE_KEY = "wie_welcome_seen";', f'const WELCOME_STORAGE_KEY = "wie_{tag}_welcome_seen";'),
              ],
              Path("wie-web/src/rust/filesystem.rs"): [
                  ('const DB_NAME: &str = "wie_filesystem";', f'const DB_NAME: &str = "wie_{tag}_filesystem";'),
              ],
              Path("wie-web/src/rust/database.rs"): [
                  ('format!("wie_{app_id}")', f'format!("wie_{tag}_{{app_id}}")'),
              ],
          }
          for path, items in replacements.items():
              data = path.read_text(encoding="utf-8")
              for old, new in items:
                  if old not in data:
                      raise SystemExit(f"Storage isolation target not found in {path}: {old}")
                  data = data.replace(old, new, 1)
              path.write_text(data, encoding="utf-8")
          print(f"Storage namespace: {tag}")
          PY

      - name: Apply and verify managed patch
        shell: bash
        working-directory: src
        run: |
          python ../control/patches/current.py
          git diff --check
          git diff --binary > ../managed.patch
          test -s ../managed.patch
          git status --short

      - name: Build production frontend
        working-directory: src
        run: |
          npm ci
          npm run build:prod

      - name: Upload exact web frontend
        uses: actions/upload-artifact@v7
        with:
          name: web-frontend-${{ github.run_id }}
          path: src/wie-web/dist
          if-no-files-found: error

      - name: Upload exact source patch
        uses: actions/upload-artifact@v7
        with:
          name: managed-source-patch-${{ github.run_id }}
          path: managed.patch
          if-no-files-found: error

  windows:
    name: Build managed Windows x64 installer
    needs: web
    runs-on: windows-latest
    steps:
      - name: Resolve inputs
        id: cfg
        shell: bash
        env:
          INPUT_BUILD_TAG: ${{ inputs.build_tag }}
          INPUT_UPSTREAM_REF: ${{ inputs.upstream_ref }}
        run: |
          BUILD_TAG="${INPUT_BUILD_TAG:-zenonia-v4-fixed}"
          UPSTREAM_REF="${INPUT_UPSTREAM_REF:-$DEFAULT_WIE_REF}"
          BUILD_TAG="$(printf '%s' "$BUILD_TAG" | tr -cd 'A-Za-z0-9._-' | cut -c1-40)"
          [ -n "$BUILD_TAG" ] || BUILD_TAG="managed"
          echo "build_tag=$BUILD_TAG" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=$UPSTREAM_REF" >> "$GITHUB_OUTPUT"

      - name: Checkout exact official WIE source
        uses: actions/checkout@v7
        with:
          repository: dlunch/wie
          ref: ${{ steps.cfg.outputs.upstream_ref }}
          path: src
          persist-credentials: false
          submodules: recursive

      - name: Download exact source patch
        uses: actions/download-artifact@v8
        with:
          name: managed-source-patch-${{ github.run_id }}
          path: managed-patch

      - name: Apply exact source patch
        shell: bash
        working-directory: src
        run: |
          git apply --check ../managed-patch/managed.patch
          git apply ../managed-patch/managed.patch
          git diff --check

      - name: Isolate managed Windows identity
        shell: bash
        env:
          BUILD_TAG: ${{ steps.cfg.outputs.build_tag }}
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, os
          path = Path("src/wie-app/tauri.conf.json")
          config = json.loads(path.read_text(encoding="utf-8"))
          run_number = int(os.environ.get("GITHUB_RUN_NUMBER", "0"))
          build_tag = os.environ["BUILD_TAG"]
          config["productName"] = "WIE Managed Test"
          config["version"] = f"0.3.{run_number}"
          config["identifier"] = "net.dlunch.wie.managed"
          for window in config.get("app", {}).get("windows", []):
              window["title"] = f"WIE Managed Test - {build_tag}"
          path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(f"Windows identity ready: {build_tag}, version 0.3.{run_number}")
          PY

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Download exact web frontend
        uses: actions/download-artifact@v8
        with:
          name: web-frontend-${{ github.run_id }}
          path: src/wie-web/dist

      - name: Build unsigned Windows installer
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: src/wie-app
          args: >-
            --config '{"build":{"beforeBuildCommand":""}}'
            --ci --target x86_64-pc-windows-msvc --bundles nsis --no-sign

      - name: Package installer
        shell: pwsh
        env:
          BUILD_TAG: ${{ steps.cfg.outputs.build_tag }}
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $installer = Get-ChildItem src/target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if (-not $installer) { throw "NSIS installer was not produced" }
          Copy-Item $installer.FullName "dist/WIE-Managed-$env:BUILD_TAG-windows-x86_64-unsigned-setup.exe"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: WIE-Managed-${{ steps.cfg.outputs.build_tag }}-Windows
          path: dist/*
          if-no-files-found: error
